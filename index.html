      } else li.firstChild.textContent=items[k].text;
    });
    document.body.appendChild(panel);
    if(matchMedia('(max-width:639px)').matches){ scrim=document.createElement('div'); scrim.className='cs-scrim'; document.body.appendChild(scrim); requestAnimationFrame(()=>scrim&&scrim.classList.add('on')); }

    const q=showSrch?panel.querySelector('.cs-srch input'):null;
    cur={api,panel,list,items,act:Math.max(0,items.findIndex(o=>o.selected)),buf:'',bt:0,q,none:panel.querySelector('.cs-none')};
    btn.setAttribute('aria-expanded','true'); btn.setAttribute('aria-controls',list.id);
    place(); setAct(cur.act,true);
    requestAnimationFrame(()=>panel.classList.add('on'));

    if(q){
      q.addEventListener('input',applyFilter);
      q.addEventListener('keydown',e=>{
        if(!cur) return;
        const k=e.key;
        if(k==='Escape'){ e.preventDefault(); e.stopPropagation(); close(); btn.focus(); }
        else if(k==='ArrowDown'||k==='ArrowUp'){ e.preventDefault(); if(cur.act>=0) setAct(step(cur.act,k==='ArrowDown'?1:-1),true); }
        else if(k==='Enter'){ e.preventDefault(); let i=cur.act; const li=i>=0?cur.list.querySelector('[data-i="'+i+'"]'):null;
          if(!li||li.hidden||cur.items[i].disabled) i=firstVis(); if(i>=0) pick(i); }
        else if(k==='Tab'){ close(); }
      });
      if(!matchMedia('(max-width:639px)').matches) q.focus({preventScroll:true});
    }
    panel.addEventListener('pointerdown',e=>{ if(e.target.closest&&e.target.closest('.cs-srch')) return; e.preventDefault(); });  // garde le focus sur le bouton
    panel.addEventListener('click',e=>{ const li=e.target.closest('.cs-opt'); if(li) pick(+li.dataset.i); });
    panel.addEventListener('pointermove',e=>{ const li=e.target.closest('.cs-opt'); if(li&&+li.dataset.i!==cur.act) setAct(+li.dataset.i,false); });
  }

  function place(){
    if(!cur) return;
    const {panel,list,api}=cur, r=api.btn.getBoundingClientRect();
    if(matchMedia('(max-width:639px)').matches){ panel.style.cssText=''; list.style.maxHeight=''; return; }
    const vw=innerWidth, vh=innerHeight, gap=6, m=10;
    const w=Math.min(Math.max(r.width,200),vw-2*m);
    panel.style.width=w+'px'; list.style.maxHeight='';
    panel.style.maxHeight='';
    const chrome=Math.max(0,panel.scrollHeight-list.scrollHeight);
    const natural=Math.min(panel.scrollHeight,360);
    const below=vh-r.bottom-gap-m, above=r.top-gap-m;
    const up=below<Math.min(natural,220)&&above>below;
    const h=Math.min(natural,up?above:below);
    panel.style.maxHeight=h+'px'; list.style.maxHeight=Math.max(60,h-chrome)+'px';
    const rtl=getComputedStyle(api.btn).direction==='rtl';
    let left=rtl?r.right-w:r.left; left=Math.max(m,Math.min(left,vw-w-m));
    panel.style.left=left+'px'; panel.style.right='auto';
    panel.classList.toggle('up',up);
    if(up){ panel.style.top='auto'; panel.style.bottom=(vh-r.top+gap)+'px'; } else { panel.style.bottom='auto'; panel.style.top=(r.bottom+gap)+'px'; }
  }

  function setAct(i,scroll){
    if(!cur||!cur.items.length) return;
    cur.act=i;
    cur.list.querySelectorAll('.cs-opt').forEach((li,k)=>li.classList.toggle('act',k===i));
    const li=cur.list.querySelector('[data-i="'+i+'"]');
    cur.api.btn.setAttribute('aria-activedescendant',li.id);
    if(scroll&&li.scrollIntoView) li.scrollIntoView({block:'nearest'});
  }
  const step=(i,d)=>{ const n=cur.items.length; for(let k=1;k<=n;k++){ const j=(i+d*k+n*k)%n;
    const li=cur.list.querySelector('[data-i="'+j+'"]');
    if(!cur.items[j].disabled&&li&&!li.hidden) return j; } return i; };

  function pick(i){
    if(!cur) return; const o=cur.items[i]; if(!o||o.disabled) return;
    const {sel,btn}=cur.api, changed=sel.value!==o.value;
    close(); sel.value=o.value;
    if(changed){ sel.dispatchEvent(new Event('input',{bubbles:true})); sel.dispatchEvent(new Event('change',{bubbles:true})); }
    btn.focus({preventScroll:true});
  }

  function close(quick){
    if(!cur) return; const {panel,api}=cur; cur=null;
    api.btn.setAttribute('aria-expanded','false'); api.btn.removeAttribute('aria-activedescendant'); api.btn.removeAttribute('aria-controls');
    const sc=scrim; scrim=null;
    if(quick){ panel.remove(); sc&&sc.remove(); return; }
    panel.classList.remove('on'); sc&&sc.classList.remove('on');
    setTimeout(()=>{ panel.remove(); sc&&sc.remove(); },220);
  }

  function onKey(e,api){
    const k=e.key;
    if(!cur){
      if(k==='ArrowDown'||k==='ArrowUp'||k==='Enter'||k===' '){ e.preventDefault(); open(api); }
      else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ e.preventDefault(); open(api); typeAhead(k); }
      return;
    }
    if(k==='Escape'){ e.preventDefault(); e.stopPropagation(); close(); }
    else if(k==='Tab'){ close(); }
    else if(k==='ArrowDown'){ e.preventDefault(); setAct(step(cur.act,1),true); }
    else if(k==='ArrowUp'){ e.preventDefault(); setAct(step(cur.act,-1),true); }
    else if(k==='Home'){ e.preventDefault(); setAct(step(-1,1),true); }
    else if(k==='End'){ e.preventDefault(); setAct(step(0,-1),true); }
    else if(k==='Enter'||k===' '){ e.preventDefault(); pick(cur.act); }
    else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ e.preventDefault(); typeAhead(k); }
  }
  function typeAhead(ch){
    clearTimeout(cur.bt); cur.buf+=ch.toLowerCase(); cur.bt=setTimeout(()=>{ if(cur) cur.buf=''; },700);
    const from=cur.buf.length>1?cur.act:cur.act+1, n=cur.items.length;
    for(let k=0;k<n;k++){ const j=(from+k)%n; if(cur.items[j].text.trim().toLowerCase().startsWith(cur.buf)&&!cur.items[j].disabled){ setAct(j,true); return; } }
  }

  document.addEventListener('pointerdown',e=>{ if(cur&&!cur.panel.contains(e.target)&&!cur.api.btn.contains(e.target)) close(); },true);
  addEventListener('resize',()=>{ cur?place():0; });
  addEventListener('scroll',e=>{ if(cur&&!cur.panel.contains(e.target)&&!matchMedia('(max-width:639px)').matches) close(); },true);
  document.addEventListener('reset',e=>{ setTimeout(()=>e.target.querySelectorAll&&e.target.querySelectorAll('select').forEach(s=>s._cs&&s._cs.sync()),0); });

  /* ---- applique à tous les <select>, présents et futurs ---- */
  function scan(root){ (root.matches&&root.matches('select')?[root]:[]).concat(Array.from(root.querySelectorAll?root.querySelectorAll('select'):[])).forEach(enhance); }
  scan(document);
  new MutationObserver(ms=>{
    for(const m of ms){
      if(m.type==='childList'){
        m.addedNodes.forEach(n=>{ if(n.nodeType===1) scan(n); });
        const t=m.target.tagName==='SELECT'?m.target:(m.target.parentNode&&m.target.parentNode.tagName==='SELECT'?m.target.parentNode:null);
        if(t&&t._cs) t._cs.sync();
      } else if(m.target._cs) m.target._cs.sync();
    }
    if(cur&&!cur.api.sel.isConnected) close(true);
  }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','aria-invalid','aria-label','aria-describedby']});
})();
</script>
</body>
</html>
